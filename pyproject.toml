[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biopulse-langgraph"
version = "0.1.0"
description = "LangChain agent evaluation harness backed by LangGraph, wrapping the framework-agnostic BioPulse core evaluation library"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yuanyuan Wang" }]
keywords = ["bioinformatics", "data-analysis", "open-problems", "langgraph", "langchain", "langsmith", "agent-evaluation"]
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langsmith>=0.8",
    "langfuse>=3",
    "openai-agents>=0.1",
    "openinference-instrumentation-openai-agents>=0.1",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
biopulse-lg = "biopulse_lg.run:main"

[tool.setuptools.packages.find]
include = ["biopulse_lg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
